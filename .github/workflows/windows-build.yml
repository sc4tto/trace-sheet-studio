name: Windows portable build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean TraceSheetStudio.spec
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TraceSheetStudio-Windows-x64
          path: dist/TraceSheetStudio/
          if-no-files-found: error
          retention-days: 30
